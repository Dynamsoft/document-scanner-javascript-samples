<div class="mds-hello-world-page">
	<div class="mds-title">
		<h2 class="mds-title-text">Hello World for Angular</h2>
	</div>
	<div class="mds-result-container">
		<p class="result-data">{{ shown().status }}</p>
		@if (shown().pdf; as pdf) {
			<a [href]="pdf" download="scan.pdf">Download the PDF</a>
		}
	</div>
</div>
